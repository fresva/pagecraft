<div id="publish-bar" class="publish-bar">
    {% if published %}
    <p class="publish-done">Publicerad! <a href="/case/{{ page_id }}" target="_blank" rel="noopener">Visa publik sida &#8599;</a></p>
    {% else %}
    <p class="publish-readiness">
        Granskade komponenter: {{ reviewed_count }}/{{ total_count }} ·
        Olösta annoteringar: {{ unresolved_count }}
    </p>
    {% if error %}<p class="publish-error">{{ error }}</p>{% endif %}
    <form hx-post="/review/{{ page_id }}/publish" hx-target="#publish-bar" hx-swap="outerHTML">
        <button type="submit" class="btn-publish" {{ 'disabled' if not ready else '' }}>Publicera</button>
    </form>
    {% endif %}
</div>
