<div class="review-component" id="review-comp-{{ c.id }}">
    <div class="review-component-bar">
        <span class="review-component-label">{{ label }}</span>
        <span class="review-badge {{ 'is-reviewed' if c.status == 'reviewer_approved' else 'not-reviewed' }}">
            {{ 'Granskad' if c.status == 'reviewer_approved' else 'Ej granskad' }}
        </span>
        {% if c.status == 'reviewer_approved' %}
        <button class="btn-unreview"
                hx-post="/review/{{ page_id }}/component/{{ c.id }}/review"
                hx-vals='{"reviewed": "false"}'
                hx-target="#review-comp-{{ c.id }}" hx-swap="outerHTML">Ångra</button>
        {% else %}
        <button class="btn-review"
                hx-post="/review/{{ page_id }}/component/{{ c.id }}/review"
                hx-vals='{"reviewed": "true"}'
                hx-target="#review-comp-{{ c.id }}" hx-swap="outerHTML">Markera granskad</button>
        {% endif %}
        <button class="btn-edit"
                hx-get="/review/{{ page_id }}/component/{{ c.id }}/edit-form"
                hx-target="#review-modal-content" hx-swap="innerHTML"
                onclick="document.getElementById('review-modal').hidden=false">Ändra fält</button>
    </div>
    {{ c.html | safe }}
</div>
