<section class="component component-personas">
    <h2>Intressenter</h2>
    <div class="personas-grid">
        {% for persona in personas | default([]) %}
        <div class="persona-card">
            <h3>{{ persona.role }}</h3>
            <p>{{ persona.benefit }}</p>
            {% if persona.quote %}
            <blockquote>"{{ persona.quote }}"</blockquote>
            {% endif %}
        </div>
        {% endfor %}
    </div>
</section>
